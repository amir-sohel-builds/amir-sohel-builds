<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" role="img" aria-labelledby="t d"><title id="t">How I run a program</title><desc id="d">Six stages in a loop: discover, align, plan, build, gate, operate. Operate feeds the next discovery.</desc><defs><linearGradient id="plbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#eeeef3"/></linearGradient><linearGradient id="plgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/></linearGradient><linearGradient id="plhl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="plhub" cx=".32" cy=".25" r=".9"><stop offset="0" stop-color="#55555a"/><stop offset="1" stop-color="#1d1d1f"/></radialGradient><filter id="plblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter><filter id="plsoft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter><filter id="plsh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.1"/></filter></defs><defs><marker id="plar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L8.5,5 L1.5,8.5" fill="none" stroke="#6e6e73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif} @media (prefers-reduced-motion: reduce){.orb,.ripple,.lit{display:none}}</style><clipPath id="plclip"><rect x="1" y="1" width="998" height="714" rx="24"/></clipPath><rect x="1" y="1" width="998" height="714" rx="24" fill="url(#plbg)"/><g clip-path="url(#plclip)" filter="url(#plblur)"><circle cx="180" cy="520" r="190" fill="#c9d2e3" opacity="0.5"/><circle cx="820" cy="200" r="200" fill="#e3dcec" opacity="0.7"/><circle cx="560" cy="640" r="160" fill="#c9d2e3" opacity="0.35"/></g><rect x="1" y="1" width="998" height="714" rx="24" fill="none" stroke="#d9d9de" stroke-width="1.5"/><text x="48" y="70" font-size="36" font-weight="600" fill="#1d1d1f" letter-spacing="-1.1">How I run a program</text><text x="48" y="102" font-size="17" fill="#6e6e73">Coordinating engineering, product, security, finops, support, and data.</text><rect x="48" y="150" width="264" height="132" rx="24" fill="url(#plgl)" filter="url(#plsh)"/><rect x="48" y="150" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-opacity="0.09" stroke-width="1"/><rect x="49" y="151" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2"/><text x="74" y="184" font-size="13" font-weight="500" fill="#6e6e73" opacity="1">01</text><text x="74" y="218" font-size="28" font-weight="600" fill="#1d1d1f" letter-spacing="-0.7">Discover</text><text x="74" y="244" font-size="15" fill="#6e6e73" opacity="1">Sit with the engineers</text><text x="74" y="264" font-size="15" fill="#6e6e73" opacity="1">who feel the pain</text><rect x="368" y="150" width="264" height="132" rx="24" fill="url(#plgl)" filter="url(#plsh)"/><rect x="368" y="150" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-opacity="0.09" stroke-width="1"/><rect x="369" y="151" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2"/><text x="394" y="184" font-size="13" font-weight="500" fill="#6e6e73" opacity="1">02</text><text x="394" y="218" font-size="28" font-weight="600" fill="#1d1d1f" letter-spacing="-0.7">Align</text><text x="394" y="244" font-size="15" fill="#6e6e73" opacity="1">Owners, decision rights,</text><text x="394" y="264" font-size="15" fill="#6e6e73" opacity="1">and the KPIs</text><rect x="688" y="150" width="264" height="132" rx="24" fill="url(#plgl)" filter="url(#plsh)"/><rect x="688" y="150" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-opacity="0.09" stroke-width="1"/><rect x="689" y="151" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2"/><text x="714" y="184" font-size="13" font-weight="500" fill="#6e6e73" opacity="1">03</text><text x="714" y="218" font-size="28" font-weight="600" fill="#1d1d1f" letter-spacing="-0.7">Plan</text><text x="714" y="244" font-size="15" fill="#6e6e73" opacity="1">Roadmap, capacity,</text><text x="714" y="264" font-size="15" fill="#6e6e73" opacity="1">dependencies mapped</text><rect x="48" y="332" width="264" height="132" rx="24" fill="url(#plgl)" filter="url(#plsh)"/><rect x="48" y="332" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-opacity="0.09" stroke-width="1"/><rect x="49" y="333" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2"/><text x="74" y="366" font-size="13" font-weight="500" fill="#6e6e73" opacity="1">04</text><text x="74" y="400" font-size="28" font-weight="600" fill="#1d1d1f" letter-spacing="-0.7">Build</text><text x="74" y="426" font-size="15" fill="#6e6e73" opacity="1">Weekly cadence,</text><text x="74" y="446" font-size="15" fill="#6e6e73" opacity="1">risks named early</text><rect x="368" y="332" width="264" height="132" rx="24" fill="#1d1d1f" filter="url(#plsh)"/><rect x="369" y="333" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2" opacity=".5"/><text x="394" y="366" font-size="13" font-weight="500" fill="#fbfbfd" opacity="0.78">05</text><text x="394" y="400" font-size="28" font-weight="600" fill="#fbfbfd" letter-spacing="-0.7">Gate</text><text x="394" y="426" font-size="15" fill="#fbfbfd" opacity="0.78">Evals pass, rollback ready,</text><text x="394" y="446" font-size="15" fill="#fbfbfd" opacity="0.78">cost capped, then launch</text><rect x="688" y="332" width="264" height="132" rx="24" fill="url(#plgl)" filter="url(#plsh)"/><rect x="688" y="332" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-opacity="0.09" stroke-width="1"/><rect x="689" y="333" width="262" height="130" rx="23" fill="none" stroke="url(#plhl)" stroke-width="1.2"/><text x="714" y="366" font-size="13" font-weight="500" fill="#6e6e73" opacity="1">06</text><text x="714" y="400" font-size="28" font-weight="600" fill="#1d1d1f" letter-spacing="-0.7">Operate</text><text x="714" y="426" font-size="15" fill="#6e6e73" opacity="1">SLOs, support load, cost.</text><text x="714" y="446" font-size="15" fill="#6e6e73" opacity="1">Measure, then learn.</text><path d="M322,216.0 L358,216.0" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" marker-end="url(#plar)"/><path d="M642,216.0 L678,216.0" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" marker-end="url(#plar)"/><path d="M820.0,288 L820.0,310 L180.0,310 L180.0,322" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#plar)"/><path d="M322,398.0 L358,398.0" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" marker-end="url(#plar)"/><path d="M642,398.0 L678,398.0" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" marker-end="url(#plar)"/><path d="M820.0,470 L820.0,504 L22,504 L22,216.0 L38,216.0" fill="none" stroke="#1d1d1f" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#plar)"/><text x="434" y="534" text-anchor="middle" font-size="14.5" fill="#6e6e73">Every result feeds the next discovery</text><circle class="orb" r="14.4" fill="#1d1d1f" opacity="0" filter="url(#plsoft)"><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.0200;0.1200;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M322,216.0 L358,216.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.16;0.16;0;0" keyTimes="0;0.0200;0.0400;0.1000;0.1200;1"/></circle><circle class="orb" r="4.5" fill="#1d1d1f" opacity="0" ><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.0200;0.1200;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M322,216.0 L358,216.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.95;0.95;0;0" keyTimes="0;0.0200;0.0400;0.1000;0.1200;1"/></circle><rect class="lit" x="368" y="150" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-opacity="0"><animate attributeName="stroke-opacity" dur="20s" repeatCount="indefinite" values="0;0;0.55;0.55;0;0" keyTimes="0;0.1200;0.1500;0.2200;0.2800;1"/></rect><circle class="orb" r="14.4" fill="#1d1d1f" opacity="0" filter="url(#plsoft)"><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.1400;0.2400;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M642,216.0 L678,216.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.16;0.16;0;0" keyTimes="0;0.1400;0.1600;0.2200;0.2400;1"/></circle><circle class="orb" r="4.5" fill="#1d1d1f" opacity="0" ><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.1400;0.2400;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M642,216.0 L678,216.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.95;0.95;0;0" keyTimes="0;0.1400;0.1600;0.2200;0.2400;1"/></circle><rect class="lit" x="688" y="150" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-opacity="0"><animate attributeName="stroke-opacity" dur="20s" repeatCount="indefinite" values="0;0;0.55;0.55;0;0" keyTimes="0;0.2400;0.2700;0.3400;0.4000;1"/></rect><circle class="orb" r="14.4" fill="#1d1d1f" opacity="0" filter="url(#plsoft)"><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.2600;0.3600;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M820.0,288 L820.0,310 L180.0,310 L180.0,322"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.16;0.16;0;0" keyTimes="0;0.2600;0.2800;0.3400;0.3600;1"/></circle><circle class="orb" r="4.5" fill="#1d1d1f" opacity="0" ><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.2600;0.3600;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M820.0,288 L820.0,310 L180.0,310 L180.0,322"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.95;0.95;0;0" keyTimes="0;0.2600;0.2800;0.3400;0.3600;1"/></circle><rect class="lit" x="48" y="332" width="264" height="132" rx="24" fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-opacity="0"><animate attributeName="stroke-opacity" dur="20s" repeatCount="indefinite" values="0;0;0.55;0.55;0;0" keyTimes="0;0.3600;0.3900;0.4600;0.5200;1"/></rect><circle class="orb" r="14.4" fill="#1d1d1f" opacity="0" filter="url(#plsoft)"><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.3800;0.4800;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M322,398.0 L358,398.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.16;0.16;0;0" keyTimes="0;0.3800;0.4000;0.4600;0.4800;1"/></circle><circle class="orb" r="4.5" fill="#1d1d1f" opacity="0" ><animateMotion dur="20s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;1;1" keyTimes="0;0.3800;0.4800;1" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1" path="M322,398.0 L358,398.0"/><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0.95;0.95;0;0" keyTimes="0;0.3800;0.4000;0.4600;0.4800;1"/></circle><circle class="orb" r="14.4" fill="#1d1d1f" opacity="0" filter="url(#plsoft)"><animateMotion dur="20s" repeatCou