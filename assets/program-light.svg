<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" role="img" aria-labelledby="t d"><title id="t">How I run a program at scale</title><desc id="d">Eight stages in a loop: discover, align, plan, build, gate, launch, operate, learn. Learn feeds the next discovery.</desc><defs><marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 z" fill="#0154fc"/></marker></defs><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif} .dash{stroke-dasharray:6 7;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-26}} .sw{fill:#fff;opacity:0;animation:sw 12s linear infinite} @keyframes sw{0%{opacity:.3} 9%{opacity:.3} 12.5%{opacity:0} 100%{opacity:0}} @media (prefers-reduced-motion: reduce){.dash,.sw{animation:none}}</style><rect x="1" y="1" width="998" height="670" rx="22" fill="#f5f6f8" stroke="#d3d8e0" stroke-width="2"/><text x="46" y="62" font-size="32" font-weight="800" fill="#0b1220" letter-spacing="-1">How I run a program at scale</text><text x="46" y="92" font-size="17" fill="#5b667a">One program lead, many teams, one operating loop.</text><rect x="46" y="112" width="125" height="30" rx="15" fill="#0154fc"/><text x="108.5" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Engineering</text><rect x="180" y="112" width="90" height="30" rx="15" fill="#6d28d9"/><text x="225.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Product</text><rect x="279" y="112" width="98" height="30" rx="15" fill="#b91c1c"/><text x="328.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Security</text><rect x="386" y="112" width="81" height="30" rx="15" fill="#0f766e"/><text x="426.5" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">FinOps</text><rect x="476" y="112" width="90" height="30" rx="15" fill="#b45309"/><text x="521.0" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Support</text><rect x="575" y="112" width="63" height="30" rx="15" fill="#be185d"/><text x="606.5" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Data</text><rect x="46" y="176" width="200" height="100" rx="16" fill="#6d28d9"/><text x="64" y="210" font-size="14" font-weight="700" fill="#fff" opacity=".7">01</text><text x="96" y="212" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Discover</text><text x="64" y="240" font-size="14.5" fill="#fff" opacity=".93">Sit with the engineers</text><text x="64" y="260" font-size="14.5" fill="#fff" opacity=".93">who feel the pain</text><rect class="sw" style="animation-delay:0.0s" x="46" y="176" width="200" height="100" rx="16"/><rect x="282" y="176" width="200" height="100" rx="16" fill="#6d28d9"/><text x="300" y="210" font-size="14" font-weight="700" fill="#fff" opacity=".7">02</text><text x="332" y="212" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Align</text><text x="300" y="240" font-size="14.5" fill="#fff" opacity=".93">Owners, decision</text><text x="300" y="260" font-size="14.5" fill="#fff" opacity=".93">rights, KPIs</text><rect class="sw" style="animation-delay:1.5s" x="282" y="176" width="200" height="100" rx="16"/><rect x="518" y="176" width="200" height="100" rx="16" fill="#6d28d9"/><text x="536" y="210" font-size="14" font-weight="700" fill="#fff" opacity=".7">03</text><text x="568" y="212" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Plan</text><text x="536" y="240" font-size="14.5" fill="#fff" opacity=".93">Roadmap, dependencies,</text><text x="536" y="260" font-size="14.5" fill="#fff" opacity=".93">capacity</text><rect class="sw" style="animation-delay:3.0s" x="518" y="176" width="200" height="100" rx="16"/><rect x="754" y="176" width="200" height="100" rx="16" fill="#0154fc"/><text x="772" y="210" font-size="14" font-weight="700" fill="#fff" opacity=".7">04</text><text x="804" y="212" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Build</text><text x="772" y="240" font-size="14.5" fill="#fff" opacity=".93">Weekly cadence,</text><text x="772" y="260" font-size="14.5" fill="#fff" opacity=".93">risks named early</text><rect class="sw" style="animation-delay:4.5s" x="754" y="176" width="200" height="100" rx="16"/><rect x="46" y="326" width="200" height="100" rx="16" fill="#b45309"/><text x="64" y="360" font-size="14" font-weight="700" fill="#fff" opacity=".7">05</text><text x="96" y="362" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Gate</text><text x="64" y="390" font-size="14.5" fill="#fff" opacity=".93">Evals pass, rollback</text><text x="64" y="410" font-size="14.5" fill="#fff" opacity=".93">ready, cost capped</text><rect class="sw" style="animation-delay:6.0s" x="46" y="326" width="200" height="100" rx="16"/><rect x="282" y="326" width="200" height="100" rx="16" fill="#0154fc"/><text x="300" y="360" font-size="14" font-weight="700" fill="#fff" opacity=".7">06</text><text x="332" y="362" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Launch</text><text x="300" y="390" font-size="14.5" fill="#fff" opacity=".93">Staged and watched,</text><text x="300" y="410" font-size="14.5" fill="#fff" opacity=".93">one-step undo</text><rect class="sw" style="animation-delay:7.5s" x="282" y="326" width="200" height="100" rx="16"/><rect x="518" y="326" width="200" height="100" rx="16" fill="#0f766e"/><text x="536" y="360" font-size="14" font-weight="700" fill="#fff" opacity=".7">07</text><text x="568" y="362" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Operate</text><text x="536" y="390" font-size="14.5" fill="#fff" opacity=".93">SLOs, support load,</text><text x="536" y="410" font-size="14.5" fill="#fff" opacity=".93">cost tracking</text><rect class="sw" style="animation-delay:9.0s" x="518" y="326" width="200" height="100" rx="16"/><rect x="754" y="326" width="200" height="100" rx="16" fill="#0f766e"/><text x="772" y="360" font-size="14" font-weight="700" fill="#fff" opacity=".7">08</text><text x="804" y="362" font-size="25" font-weight="800" fill="#fff" letter-spacing="-0.5">Learn</text><text x="772" y="390" font-size="14.5" fill="#fff" opacity=".93">Measure the result,</text><text x="772" y="410" font-size="14.5" fill="#fff" opacity=".93">pick what is next</text><rect class="sw" style="animation-delay:10.5s" x="754" y="326" width="200" height="100" rx="16"/><path d="M252,226.0 L278,226.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path d="M488,226.0 L514,226.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path d="M724,226.0 L750,226.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path d="M252,376.0 L278,376.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path d="M488,376.0 L514,376.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path d="M724,376.0 L750,376.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path class="dash" d="M854.0,280 L854.0,301 L146.0,301 L146.0,320" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><path class="dash" d="M854.0,430 L854.0,464 L22,464 L22,226.0 L40,226.0" fill="none" stroke="#0154fc" stroke-width="3" stroke-linecap="round" opacity=".75" marker-end="url(#ar)"/><text x="450" y="492" text-anchor="middle" font-size="15" font-style="italic" fill="#5b667a">Every result feeds the next discovery</text><line x1="46" y1="530" x2="954" y2="530" stroke="#d3d8e0" stroke-width="2"/><text x="46" y="566" font-size="40" font-weight="800" fill="#0154fc" letter-spacing="-1.5">140M+</text><text x="46" y="592" font-size="14.5" fill="#2b3548">subscribers on the platform</text><text x="356" y="566" font-size="40" font-weight="800" fill="#0154fc" letter-spacing="-1.5">4</text><text x="356" y="592" font-size="14.5" fill="#2b3548">streaming brands: HBO Max,</text><text x="356" y="611" font-size="14.5" fill="#2b3548">Discovery+, TNT Sports, CNN</text><text x="666" y="566" font-size="40" font-weight="800" fill="#0154fc" letter-spacing="-1.5">&lt;4 hrs</text><text x="666" y="592" font-size="14.5" fill="#2b3548">code to production,</text><text x="666" y="611" font-size="14.5" fill="#2b3548">down from three days</text><text x="46" y="650" font-size="13.5" fill="#5b667a">Platform scale belongs to the engineering teams. The programs on top are what I lead.</text></svg>