me="stroke-opacity" dur="20s" repeatCount="indefinite" values="0;0;0.55;0.55;0;0" keyTimes="0;0.7200;0.7500;0.8200;0.8800;1"/></rect><line x1="48" y1="578" x2="952" y2="578" stroke="#1d1d1f" stroke-opacity=".14" stroke-width="1.2"/><text x="48" y="620" font-size="38" font-weight="600" fill="#1d1d1f" letter-spacing="-1.2">140M+</text><text x="48" y="646" font-size="14.5" fill="#6e6e73">subscribers on the platform</text><text x="360" y="620" font-size="38" font-weight="600" fill="#1d1d1f" letter-spacing="-1.2">4</text><text x="360" y="646" font-size="14.5" fill="#6e6e73">streaming brands: HBO Max,</text><text x="360" y="665" font-size="14.5" fill="#6e6e73">Discovery+, TNT Sports, CNN</text><text x="672" y="620" font-size="38" font-weight="600" fill="#1d1d1f" letter-spacing="-1.2">&lt;4 hrs</text><text x="672" y="646" font-size="14.5" fill="#6e6e73">code to production,</text><text x="672" y="665" font-size="14.5" fill="#6e6e73">down from three days</text><text x="48" y="690" font-size="13.5" fill="#6e6e73">Platform scale belongs to the engineering teams. The programs on top are what I lead.</text></svg>